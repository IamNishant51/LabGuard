[project]
name = "labguard-api"
version = "0.1.0"
description = "LabGuard central API (M1 scaffold: health endpoint only)"
requires-python = "==3.12.*"
dependencies = [
  "fastapi>=0.115,<0.117",
  "uvicorn[standard]>=0.30,<0.35",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.13,<1.17",
  "pydantic>=2.0,<3.0",
  "httpx>=0.27,<0.29",
  "bcrypt>=4.1,<5.0",
  "psycopg[binary]>=3.1,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.6,<0.9",
  "mypy>=1.11,<1.18",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
