[project]
name = "labguard-agent"
version = "0.1.0"
description = "LabGuard monitoring agent skeleton (M1: packaging only, no collection)"
requires-python = "==3.12.*"
dependencies = [
  "psutil>=6.0,<8.0",
  "httpx>=0.27,<0.29",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
